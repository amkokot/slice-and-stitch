<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slice & Stitch · Counter pose fitting</title>
  <link rel="stylesheet" href="hub.css">
  <link rel="stylesheet" href="scene-character-layout.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #342a24; color: #ffedcd; font: 15px system-ui; }
    header { padding: 12px 20px; display: flex; align-items: center; flex-wrap: wrap; gap: 16px; }
    h1 { font-size: 18px; margin: 0; }
    select, button { font: inherit; }
    .hub-scene-stage { width: min(1672px, 100%); min-height: 0; aspect-ratio: 1672 / 941; margin: 0 auto; position: relative; overflow: hidden; }
    .hub-scene-art { background: url('assets/hub/restaurant-counter-v2.png') center / 100% 100%; }
    .hub-actors { pointer-events: none; }
    .hub-actor.is-player { display: none; }
    .guides { position: absolute; inset: 0; pointer-events: none; }
    .guide { position: absolute; width: 5.5%; height: 1.8%; border: 1px dashed #67ffff; border-radius: 50%; transform: translate(-50%, -50%); }
    .guides[hidden] { display: none; }
    a { color: inherit; }
  </style>
</head>
<body>
  <header><h1>Counter pose fitting</h1><label>Pose <select id="pose"><option value="">Rest</option><option value="order">Ordering</option><option value="wait">Waiting</option><option value="eat">Eating</option></select></label><label><input id="guides" type="checkbox"> Seat contacts</label><span>All four identities · same painted stools · no saved progress</span><a href="/#restaurant">Game</a></header>
  <main class="hub-scene-stage" data-scene="restaurant" aria-label="Counter pose comparison">
    <div class="hub-scene-art"></div>
    <div class="hub-actors" aria-label="Seated customers"></div>
    <div class="guides" hidden></div>
  </main>
  <script type="module" src="seat-fit-qa.js"></script>
</body>
</html>
